pihole:
  dnsmasq:
    customDnsEntries:
      - address=/internal.local/192.168.1.20
      - address=/argocd.local/192.168.1.21
      - address=/longhorn.local/192.168.1.22
      - address=/postgresql.local/192.168.1.23
      - address=/redis.local/192.168.1.24
      - address=/pi.hole/192.168.1.25
      - address=/lib.local/192.168.1.31

    # customCnameEntries:
    #   - cname=longhorn.local,longhorn

  persistentVolumeClaim:
    enabled: true

  serviceWeb:
    loadBalancerIP: 192.168.1.25
    annotations:
      metallb.universe.tf/allow-shared-ip: pihole-svc
    type: LoadBalancer

  serviceDns:
    loadBalancerIP: 192.168.1.25
    annotations:
      metallb.universe.tf/allow-shared-ip: pihole-svc
    type: LoadBalancer
